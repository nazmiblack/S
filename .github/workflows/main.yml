name: Send Discord Notification on Game Add

on:
  push:
    branches:
      - main
      - master

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Get changed files using git
        id: git-files
        run: |
          # Ambil senarai fail yang baru ditambah/diubah dalam commit terkini
          changed_files=$(git diff-tree --no-commit-id --name-only -r${{ github.sha }})
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$changed_files" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Send Discord Webhook
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          echo "Meneroka senarai fail..."
          for file in ${{ steps.git-files.outputs.files }}; do
            if [[ "$file" == *.lua ]]; then
              filename=$(basename "$file")
              appid="${filename%.*}"
              echo "Jumpa fail Lua: $appid"
              
              curl -H "Content-Type: application/json" \
                   -d "{\"embeds\": [{\"title\": \"New Game Added!\", \"color\": 65280, \"fields\": [{\"name\": \"App ID:\", \"value\": \"\`$appid\`\", \"inline\": false}], \"footer\": {\"text\": \"Automated GitHub Update\"}}]}" \
                   $DISCORD_WEBHOOK
            fi
          done
