name: Send Discord Notification on Game Add

on:
  push:
    branches:
      - main
      - master

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v35

      - name: Send Rich Embed to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python3 - << 'EOF'
          import os
          import json
          import urllib.request
          import urllib.parse

          webhook_url = os.environ.get("DISCORD_WEBHOOK")
          changed_files = os.environ.get("ALL_CHANGED_FILES", "").split()

          # Cari fail .lua yang baru di-push
          for file_path in changed_files:
              if file_path.endswith(".lua"):
                  appid = os.path.splitext(os.path.basename(file_path))[0]
                  if not appid.isdigit():
                      continue

                  # Tarik maklumat game dari Steam API
                  name = f"App ID {appid}"
                  released = "N/A"
                  genres = "N/A"
                  header_image = ""

                  try:
                      url = f"https://store.steampowered.com/api/appdetails?appids={appid}"
                      req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                      with urllib.request.urlopen(req, timeout=10) as res:
                          data = json.loads(res.read().decode('utf-8'))
                          if data and str(appid) in data and data[str(appid)].get("success"):
                              info = data[str(appid)]["data"]
                              name = info.get("name", name)
                              released = info.get("release_date", {}).get("date", "N/A")
                              
                              genre_list = [g.get("description") for g in info.get("genres", [])]
                              if genre_list:
                                  genres = ", ".join(genre_list)
                              
                              header_image = info.get("header_image", "")
                  except Exception as e:
                      print(f"Error fetching Steam API: {e}")

                  # Format Kad Embed untuk Discord
                  payload = {
                      "embeds": [
                          {
                              "title": f"{name} Added",
                              "color": 65280, # Garisan hijau di tepi kad
                              "fields": [
                                  {"name": "App ID:", "value": f"`{appid}`", "inline": False},
                                  {"name": "Released:", "value": released, "inline": False},
                                  {"name": "Genres:", "value": genres, "inline": False}
                              ],
                              "image": {
                                  "url": header_image
                              },
                              "footer": {
                                  "text": "Automated GitHub Update"
                              }
                          }
                      ]
                  }

                  # Hantar ke Discord Webhook
                  req_discord = urllib.request.Request(
                      webhook_url,
                      data=json.dumps(payload).encode('utf-8'),
                      headers={'Content-Type': 'application/json', 'User-Agent': 'Mozilla/5.0'}
                  }
                  try:
                      urllib.request.urlopen(req_discord)
                      print(f"Successfully sent notification for {name}")
                  except Exception as e:
                      print(f"Failed to send Discord webhook: {e}")
          EOF
          env:
            ALL_CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
