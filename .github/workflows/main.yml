name: Send Discord Notification on Game Add

on:
  push:
    branches:
      - main
      - master

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Send Discord Webhook
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          # Cari fail .lua yang baru di-commit dalam push terkini
          changed_files=$(git diff --name-only HEAD^ HEAD)
          
          for file in $changed_files; do
            if [[ "$file" == *.lua ]]; then
              filename=$(basename "$file")
              appid="${filename%.*}"
              echo "Jumpa fail Lua: $appid"
              
              curl -H "Content-Type: application/json" \
                   -d "{\"embeds\": [{\"title\": \"New Game Added!\", \"color\": 65280, \"fields\": [{\"name\": \"App ID:\", \"value\": \"\`$appid\`\", \"inline\": false}], \"footer\": {\"text\": \"Automated GitHub Update\"}}]}" \
                   $DISCORD_WEBHOOK
            fi
          done